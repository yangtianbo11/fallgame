<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>字母掉落小游戏（全端适配）</title>
  <script>
    var _sdkUrls = [
      'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js',
      'https://unpkg.com/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js',
      'https://registry.npmmirror.com/microsoft-cognitiveservices-speech-sdk/latest/files/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js'
    ];
    var _sdkIdx = 0;
    function _loadSdk(){
      if(_sdkIdx >= _sdkUrls.length){ console.warn('All Speech SDK CDNs failed'); return; }
      var s = document.createElement('script');
      s.src = _sdkUrls[_sdkIdx];
      s.onload = function(){ console.log('Speech SDK loaded from: ' + _sdkUrls[_sdkIdx]); };
      s.onerror = function(){ console.warn('SDK CDN failed: ' + _sdkUrls[_sdkIdx]); _sdkIdx++; _loadSdk(); };
      document.head.appendChild(s);
    }
    _loadSdk();
  </script>
  <style>
    :root{
      --bg:#0b1020;
      --panel:#0f1733cc;
      --text:#eaf1ff;
      --muted:#a9b7dd;
      --accent:#7aa7ff;
      --danger:#ff7a9c;
      --ok:#7dffb2;
      --warn:#ffd37a;
      --safe-top:max(12px, env(safe-area-inset-top));
      --safe-right:max(12px, env(safe-area-inset-right));
      --safe-bottom:max(12px, env(safe-area-inset-bottom));
      --safe-left:max(12px, env(safe-area-inset-left));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC","Noto Sans SC",Arial}
    body{
      background:
        radial-gradient(1200px 600px at 20% 10%, #1c2b61 0%, transparent 55%),
        radial-gradient(900px 500px at 80% 20%, #2c155e 0%, transparent 55%),
        var(--bg);
      color:var(--text);
      overflow:hidden;
      user-select:none;
      touch-action:manipulation;
    }
    #game{position:relative;width:100%;height:100dvh;min-height:100vh;overflow:hidden;outline:none}
    #flash{position:absolute;inset:0;background:rgba(255,122,156,.10);opacity:0;pointer-events:none;z-index:5}
    #flash.bad{animation:flash 220ms ease-out}
    @keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}

    #leaderboard{
      position:absolute;left:var(--safe-left);top:calc(var(--safe-top) + 92px);z-index:8;
      width:min(260px,42vw);padding:10px 12px;border-radius:14px;
      background:var(--panel);border:1px solid #2a3a75;backdrop-filter:blur(8px);
      box-shadow:0 10px 30px rgba(0,0,0,.25)
    }
    #leaderboardTitle{font-size:14px;font-weight:900;margin-bottom:8px}
    #leaderboardList{display:flex;flex-direction:column;gap:6px}
    .lbItem{display:grid;grid-template-columns:26px 56px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
    .lbItem.current{background:rgba(125,255,178,.10);border-color:rgba(125,255,178,.35);box-shadow:0 0 0 2px rgba(125,255,178,.10)}
    .lbRank{font-weight:900;color:var(--warn)}
    .lbScore{font-weight:900}
    .lbTime{font-size:11px;color:var(--muted);line-height:1.3}

    #hud{
      position:absolute;left:var(--safe-left);top:var(--safe-top);z-index:20;
      display:flex;flex-wrap:wrap;gap:8px;align-items:center;
      padding:10px 12px;max-width:min(96vw,720px);border-radius:14px;
      background:var(--panel);border:1px solid #2a3a75;backdrop-filter:blur(8px);
      box-shadow:0 10px 30px rgba(0,0,0,.25)
    }
    .pill{display:flex;gap:8px;align-items:baseline;white-space:nowrap;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
    .pill .k{color:var(--muted);font-size:12px}
    .pill .v{font-weight:900;letter-spacing:.4px}
    .pill.good .v{color:var(--ok)}
    .pill.bad .v{color:var(--danger)}
    .pill.warn .v{color:var(--warn)}
    #recDot{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);box-shadow:0 0 0 2px rgba(255,255,255,.10)}
    #recDot.on{background:var(--danger);box-shadow:0 0 0 3px rgba(255,122,156,.20),0 0 18px rgba(255,122,156,.45);animation:recPulse 1s ease-in-out infinite}
    @keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

    #controlBar{
      position:absolute;right:var(--safe-right);top:var(--safe-top);z-index:20;
      display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;align-items:center;
      max-width:min(96vw,820px);padding:10px 12px;border-radius:14px;
      background:var(--panel);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,.25)
    }
    .btn{padding:10px 12px;min-height:42px;border-radius:12px;font-weight:800;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer}
    .btn.primary{border-color:rgba(122,167,255,.55);background:rgba(122,167,255,.15)}
    .btn.danger{border-color:rgba(255,122,156,.45);background:rgba(255,122,156,.12)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    #pauseOverlay{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;justify-content:center;align-items:center;font-size:clamp(28px,6vw,56px);font-weight:900;color:rgba(255,255,255,.7);letter-spacing:4px;pointer-events:none}
    #pauseOverlay.show{display:flex}

    #settings{
      position:absolute;right:var(--safe-right);top:calc(var(--safe-top) + 64px);z-index:60;display:none;
      width:min(92vw,340px);max-height:min(72dvh,520px);overflow:auto;
      padding:12px;border-radius:14px;background:var(--panel);border:1px solid #2a3a75;
      backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.28)
    }
    #settings.show{display:block}
    #dictationPanel{
      position:absolute;right:var(--safe-right);top:calc(var(--safe-top) + 64px);z-index:25;display:none;
      width:min(92vw,340px);padding:12px;border-radius:14px;background:var(--panel);border:1px solid #2a3a75;
      backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.28)
    }
    #dictationPanel.show{display:block}
    #dictationTitle{font-size:14px;font-weight:900;margin-bottom:6px}
    #dictationBody{font-size:12px;color:var(--muted);line-height:1.55;white-space:pre-wrap}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}
    label{font-size:12px;color:var(--muted)}
    input[type="range"]{width:150px}
    input[type="number"],select{width:96px;padding:7px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.18);color:var(--text)}
    select{width:150px}
    .small{font-size:12px;color:var(--muted);line-height:1.45}

    .letter{
      position:absolute;font-weight:900;letter-spacing:1px;text-shadow:0 10px 25px rgba(0,0,0,.45);
      transform:translate(-50%,-50%);will-change:transform,top,opacity;z-index:30
    }
    .hit{animation:hitPop 260ms ease-out forwards;filter:drop-shadow(0 0 14px rgba(125,255,178,.55))}
    @keyframes hitPop{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(2);opacity:.95}}
    .settled-clicked{transform:translate(-50%,-50%) scale(1.5);color:#ffd37a;z-index:32}

    #ground{position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(to top, rgba(0,0,0,.48), transparent);z-index:1;pointer-events:none}

    #kbdWrap{
      position:absolute;left:50%;bottom:calc(var(--safe-bottom) + 12px);transform:translateX(-50%);z-index:30;
      width:min(96vw,560px);padding:10px 12px;border-radius:16px;background:rgba(15,23,51,.55);
      border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.22)
    }
    .kbdRow{display:flex;gap:6px;justify-content:center;margin:6px 0}
    .key{width:clamp(28px,7.2vw,42px);height:clamp(32px,8vw,44px);border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--text);font-weight:900;text-transform:uppercase;font-size:clamp(12px,3vw,16px)}
    .key.active{border-color:rgba(122,167,255,.75);box-shadow:0 0 0 2px rgba(122,167,255,.18),0 10px 20px rgba(0,0,0,.25);background:rgba(122,167,255,.14)}
    .key.newest{border-color:rgba(125,255,178,.85);background:rgba(125,255,178,.12);box-shadow:0 0 0 3px rgba(125,255,178,.18),0 10px 22px rgba(0,0,0,.28);animation:newestPulse 380ms ease-out}
    .key.pressed{border-color:rgba(255,211,122,.9);background:rgba(255,211,122,.14)}
    @keyframes newestPulse{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}

    #micStatus{
      position:absolute;left:50%;bottom:calc(var(--safe-bottom) + 200px);transform:translateX(-50%);z-index:35;display:none;
      padding:10px 18px;border-radius:14px;background:rgba(15,23,51,.72);border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);text-align:center;font-size:13px;color:var(--muted);gap:8px;align-items:center
    }
    #micStatus.show{display:flex}
    #micDot{width:12px;height:12px;border-radius:999px;background:var(--ok);box-shadow:0 0 0 3px rgba(125,255,178,.18),0 0 14px rgba(125,255,178,.35);animation:recPulse 1s ease-in-out infinite}
    #micStatus.error #micDot{background:var(--danger);box-shadow:0 0 0 3px rgba(255,122,156,.18),0 0 14px rgba(255,122,156,.35)}

    #mobileInputWrap{position:absolute;left:50%;bottom:calc(var(--safe-bottom) + 136px);transform:translateX(-50%);z-index:35;display:none;width:min(88vw,340px);padding:8px 10px;border-radius:14px;background:rgba(15,23,51,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);text-align:center}
    #mobileInputWrap.show{display:block}
    #mobileInput{width:100%;padding:12px 14px;min-height:46px;border-radius:12px;outline:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--text);text-align:center;font-size:16px}
    #mobileHint{font-size:12px;color:var(--muted);margin-top:6px}

    #tapToEnable{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.40);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);z-index:80;text-align:center;max-width:min(92vw,360px)}
    #tapToEnable strong{display:block;margin-bottom:6px}
    #tapToEnable.hide{display:none}

    #gameOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:90;backdrop-filter:blur(6px)}
    #gameOver.show{display:flex}
    .overCard{width:min(440px,calc(100% - 40px));padding:18px 16px;border-radius:16px;background:rgba(15,23,51,.85);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
    .overTitle{font-size:22px;font-weight:900;margin:6px 0 10px}
    .overStats{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:12px}

    @media (max-width:900px){
      #leaderboard{left:var(--safe-left);top:calc(var(--safe-top) + 118px);width:min(240px,46vw)}
      #hud,#controlBar{max-width:calc(100vw - 24px)}
      #controlBar{left:50%;right:auto;transform:translateX(-50%);top:auto;bottom:calc(var(--safe-bottom) + 12px);width:min(96vw,820px);justify-content:center}
      #settings,#dictationPanel{top:auto;bottom:calc(var(--safe-bottom) + 72px)}
      #kbdWrap{bottom:calc(var(--safe-bottom) + 74px)}
      #mobileInputWrap{bottom:calc(var(--safe-bottom) + 198px)}
    }
    @media (max-width:640px){
      #hud{padding:8px 10px;gap:6px;max-width:calc(100vw - 16px)}
      .pill{padding:5px 8px}.pill .k{font-size:11px}.pill .v{font-size:13px}
      #controlBar{position:fixed;left:50%;right:auto;transform:translateX(-50%);top:auto;bottom:calc(var(--safe-bottom) + 10px);width:min(96vw,420px);padding:10px;gap:8px;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;z-index:55}
      #controlBar .btn{display:block!important;width:100%;justify-self:stretch;min-width:0}
      #settings,#dictationPanel{left:50%;right:auto;transform:translateX(-50%);width:min(94vw,360px)}
      .row{gap:8px} input[type="range"]{width:120px} select{width:120px}
      #kbdWrap{width:min(98vw,380px);padding:8px;bottom:calc(var(--safe-bottom) + 86px)}
      .kbdRow{gap:4px}
      #mobileInputWrap{bottom:calc(var(--safe-bottom) + 210px);width:min(92vw,360px);z-index:54}
      #basicModeBtn,#advancedModeBtn,#startGameBtn,#startRecBtn,#settingsBtn,#inputModeBtn{display:block!important;visibility:visible!important;opacity:1!important}
    }
  </style>
</head>
<body>
  <div id="game" tabindex="0" aria-label="字母掉落小游戏">
    <div id="flash"></div>

    <div id="hud">
      <div class="pill"><span class="k" id="labelScore">分数</span><span class="v" id="score">0</span></div>
      <div class="pill warn"><span class="k" id="labelHp">生命</span><span class="v" id="hp">❤❤❤❤❤</span></div>
      <div class="pill good"><span class="k" id="labelCombo">连击</span><span class="v" id="combo">0</span></div>
      <div class="pill bad"><span class="k" id="labelMistakes">连错</span><span class="v" id="streakBad">0</span></div>
      <div class="pill"><span class="k" id="labelLevel">Level</span><span class="v" id="level">1</span></div>
      <div class="pill"><span class="k" id="labelRec">REC</span><span class="v" style="display:flex;align-items:center;gap:8px"><span id="recDot"></span><span id="recText">OFF</span></span></div>
      <span id="pauseBtn" class="pill" style="cursor:pointer;opacity:0.4;user-select:none" disabled>⏸</span>
    </div>

    <div id="leaderboard" aria-label="最高分排行榜">
      <div id="leaderboardTitle">最高分 Top 5</div>
      <div id="leaderboardList"></div>
    </div>

    <div id="controlBar">
      <button class="btn" id="basicModeBtn">基础</button>
      <button class="btn" id="advancedModeBtn">听写</button>
      <button class="btn primary" id="startGameBtn">开始游戏</button>
      <button class="btn" id="startRecBtn">开始录音</button>
      <button class="btn" id="settingsBtn">设置</button>
      <button class="btn" id="inputModeBtn">🎤</button>
    </div>

    <div id="dictationPanel" aria-live="polite">
      <div id="dictationTitle">AI语音评分</div>
      <div id="dictationBody">完成基础模式后，点击“听写”开始评分。</div>
    </div>

    <div id="settings">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
        <strong id="settingsTitle" style="font-size:14px;">设置</strong>
        <button class="btn" id="closeSettingsBtn" type="button" style="padding:6px 10px;min-height:auto;">关闭</button>
      </div>
      <div class="row"><label for="baseSpeed" id="labelBaseSpeed">基础掉落速度</label><input id="baseSpeed" type="range" min="21" max="184" value="80" /></div>
      <div class="row"><label for="baseSpawn" id="labelBaseSpawn">字母出现速度(ms)</label><input id="baseSpawn" type="number" min="250" max="3000" step="50" value="900" /></div>
      <div class="row"><label for="maxLetters" id="labelMaxLetters">最大同时字母数</label><input id="maxLetters" type="number" min="3" max="30" step="1" value="12" /></div>
      <div class="row"><label for="hpMax" id="labelHpMax">最大生命(❤)</label><input id="hpMax" type="number" min="1" max="20" step="1" value="10" /></div>
      <div class="row"><label for="levelEvery" id="labelLevelEvery">难度升级速度(秒)</label><input id="levelEvery" type="number" min="5" max="60" step="1" value="12" /></div>
      <div class="row"><label for="voiceLang" id="labelVoiceLang">发音语言</label><select id="voiceLang"><option value="en-US">英语(美)</option><option value="en-GB">英语(英)</option><option value="en-AU">英语(澳)</option></select></div>
      <div class="row"><label for="voiceDuration" id="labelVoiceDuration">发音时长倍率</label><input id="voiceDuration" type="range" min="1" max="4" step="0.5" value="2.5" /></div>
      <div class="small" id="azureNote">Firefox/微信浏览器需填写 Azure 语音服务密钥才能使用语音输入。多个key用逗号分隔，用量接近上限时自动切换。</div>
      <div class="row"><label for="azureKey" id="labelAzureKey">Azure Key(s)</label><textarea id="azureKey" rows="2" placeholder="key1, key2, key3" style="width:140px;font-size:11px;resize:vertical"></textarea></div>
      <div class="row"><label for="azureRegion" id="labelAzureRegion">Azure 区域</label><input id="azureRegion" type="text" value="eastasia" placeholder="如 eastasia" style="width:140px" /></div>
      <div class="row" id="azureUsageRow"><label id="labelAzureUsage">Key用量</label><span id="azureUsageInfo" style="font-size:11px;color:#8fa4c8">加载中...</span></div>
      <div class="small" id="settingsNote">手机和平板可直接点输入框调出系统键盘。录屏优先尝试 MP4；若浏览器不支持，会自动保存为 WebM。</div>
      <div class="row"><button class="btn danger" id="clearLeaderboardBtn" style="width:100%;">清空排行榜</button></div>
      <div class="row"><label for="uiLanguage" id="labelUiLanguage">界面语言</label><select id="uiLanguage"><option value="zh-CN">中文</option><option value="en">English</option></select></div>
    </div>

    <div id="micStatus"><span id="micDot"></span><span id="micLabel">语音输入中</span></div>

    <div id="mobileInputWrap">
      <input id="mobileInput" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="1" placeholder="点这里，用手机键盘输入字母" />
      <div id="mobileHint">手机/平板可用系统键盘；笔记本可直接敲实体键盘</div>
    </div>

    <div id="kbdWrap" aria-label="笔记本键盘">
      <div class="kbdRow" id="row1"></div>
      <div class="kbdRow" id="row2"></div>
      <div class="kbdRow" id="row3"></div>
    </div>

    <div id="tapToEnable"><strong id="tapTitle">点一下启用音效/发音</strong><div class="small" id="tapBody">手机、平板、笔记本都需要先点击一次页面，浏览器才允许播放音效与语音。</div></div>
    <div id="pauseOverlay">⏸ PAUSED</div>
    <div id="ground"></div>

    <div id="gameOver">
      <div class="overCard">
        <div class="overTitle" id="gameOverTitle">Game Over</div>
        <div class="overStats" id="overStats"></div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
          <button class="btn primary" id="restartBtn">重新开始</button>
          <button class="btn" id="closeOverBtn">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const I18N = {
      'zh-CN': {
        basic:'基础', advanced:'听写', stopDictation:'停止听写', startGame:'开始游戏', endGame:'结束游戏', startRec:'开始录音', stopRec:'结束录音', settings:'设置', close:'关闭', restart:'重新开始',
        score:'分数', hp:'生命', combo:'连击', mistakes:'连错', level:'Level', rec:'REC',
        leaderboardTitle:'最高分 Top 5', noRecords:'暂无记录', clearLeaderboard:'清空排行榜',
        baseSpeed:'基础掉落速度', baseSpawn:'字母出现速度(ms)', maxLetters:'最大同时字母数', hpMax:'最大生命(❤)', levelEvery:'难度升级速度(秒)', voiceLang:'发音语言', voiceDuration:'发音时长倍率', uiLanguage:'界面语言',
        settingsNote:'手机和平板可直接点输入框调出系统键盘。录屏优先尝试 MP4；若浏览器不支持，会自动保存为 WebM。',
        mobileHint:'手机/平板可用系统键盘；笔记本可直接敲实体键盘', mobilePlaceholder:'点这里，用手机键盘输入字母',
        tapTitle:'点一下启用音效/发音', tapBody:'手机、平板、笔记本都需要先点击一次页面，浏览器才允许播放音效与语音。',
        gameOver:'Game Over', reason:'原因', manualEnd:'手动结束', wrongKey:'按错（屏幕上没有该字母）', missed:'漏掉（落到底部）',

    function normalizeSpeechText(text){
      return String(text || '').toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function transcriptToLetter(text){
      const normalized = normalizeSpeechText(text);
      if (!normalized) return '';
      if (normalized.length === 1 && normalized >= 'a' && normalized <= 'z') return normalized;
      for (const [letter, aliases] of Object.entries(LETTER_ALIASES)) {
        if (aliases.includes(normalized)) return letter;
      }
      const parts = normalized.split(' ');
      for (const part of parts) {
        if (part.length === 1 && part >= 'a' && part <= 'z') return part;
        for (const [letter, aliases] of Object.entries(LETTER_ALIASES)) {
          if (aliases.includes(part)) return letter;
        }
      }
      let bestLetter = '';
      let bestScore = 0;
      const candidates = [normalized, ...parts];
      for (const candidate of candidates) {
        if (!candidate) continue;
        for (const [letter, aliases] of Object.entries(LETTER_ALIASES)) {
          for (const alias of aliases) {
            const s = scoreAliasSimilarity(candidate, alias);
            if (s > bestScore) { bestScore = s; bestLetter = letter; }
          }
        }
      }
      return bestScore >= 65 ? bestLetter : '';
    }
    function levenshtein(a, b){
      const s = a || '';
      const t = b || '';
      const rows = s.length + 1;
      const cols = t.length + 1;
      const dp = Array.from({ length: rows }, () => Array(cols).fill(0));
      for (let i = 0; i < rows; i++) dp[i][0] = i;
      for (let j = 0; j < cols; j++) dp[0][j] = j;
      for (let i = 1; i < rows; i++) {
        for (let j = 1; j < cols; j++) {
          const cost = s[i - 1] === t[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[rows - 1][cols - 1];
    }
    function scoreAliasSimilarity(spoken, alias){
      const heard = normalizeSpeechText(spoken);
      const target = normalizeSpeechText(alias);
      if (!heard || !target) return 0;
      if (heard === target) return 100;
      if (heard.includes(target) || target.includes(heard)) return 92;
      const distance = levenshtein(heard, target);
      const maxLen = Math.max(heard.length, target.length, 1);
      const similarity = 1 - (distance / maxLen);
      return Math.max(0, Math.min(100, Math.round(similarity * 100)));
    }
    function scorePronunciation(expected, alternatives = []){
      const aliases = LETTER_ALIASES[expected] || [expected];
      const fallbackAlternatives = alternatives.length ? alternatives : [{ transcript: '', confidence: 0 }];
      let best = { heard: '', score: 0, pass: false };
      for (const alt of fallbackAlternatives) {
        const transcript = normalizeSpeechText(alt.transcript);
        const confidence = Number.isFinite(alt.confidence) ? alt.confidence : 0;
        let aliasScore = 0;
        for (const alias of aliases) aliasScore = Math.max(aliasScore, scoreAliasSimilarity(transcript, alias));
        const mappedLetter = transcriptToLetter(transcript);
        if (mappedLetter === expected) aliasScore = Math.max(aliasScore, 96);
        else if (mappedLetter && mappedLetter !== expected) aliasScore = Math.min(aliasScore, 45);
        const finalScore = Math.max(0, Math.min(100, Math.round(aliasScore + Math.min(6, confidence * 10))));
        if (finalScore > best.score) {
          best = { heard: transcript || '', score: finalScore, pass: finalScore >= 70 };
        }
      }
      return best;
    }

    const COLORS = ['#eaf1ff','#7aa7ff','#ffd37a','#7dffb2','#ff7a9c'];

    function topSpawnY(topBlocked){ return Math.max(36, Math.min(80, topBlocked * 0.2)); }

    function getGameBounds(){
      const hudRect = $('hud').getBoundingClientRect();

      const kbdWrapEl = $('kbdWrap');

      const topBlocked = Math.max(hudRect.bottom, 20) + 18;
      const candidates = [];
      if (kbdRect && kbdRect.height > 0) candidates.push(kbdRect.top);

      if (controlRect.top > window.innerHeight * 0.55) candidates.push(controlRect.top);
      const bottomAnchorTop = candidates.length ? Math.min(...candidates) : window.innerHeight;
      const bottomBlocked = Math.max(40, window.innerHeight - bottomAnchorTop + 22);

    function spawnLetter(chOverride = null){
      if (!running || letters.length >= maxLetters()) return;

      const x = gameMode === 'basic' ? game.clientWidth / 2 : rand(30, game.clientWidth - 30);
      const y = topSpawnY(bounds.topBlocked);
      const voiceBasic = gameMode === 'basic' && isVoiceMode();
      const deathLine = voiceBasic

    function getSettledLayoutMetrics(totalCount = settledLetters.length){
      const bounds = getGameBounds();
      const areaTop = bounds.topBlocked + 20;
      const areaBottom = game.clientHeight - bounds.bottomBlocked - 20;
      const availableLeft = 28;
      const availableWidth = Math.max(260, game.clientWidth - 56);
      const cols = 13;
      const count = Math.max(1, totalCount);
      const rows = count > cols ? 2 : 1;
      const rowGap = Math.min(70, Math.max(48, 60));
      const blockHeight = (rows - 1) * rowGap;
      const midY = (areaTop + areaBottom) / 2;
      const centerY = midY - blockHeight / 2;
      return { availableLeft, availableWidth, cols, count, rows, rowGap, centerY };
    }
    function computeSettledPosition(order, totalCount = settledLetters.length){
      const layout = getSettledLayoutMetrics(totalCount);
      const { availableLeft, availableWidth, cols, count, rowGap, centerY } = layout;
      const row = Math.floor(order / cols);
      const col = order % cols;
      const itemsBeforeRow = row * cols;
      const totalInRow = Math.min(cols, Math.max(0, count - itemsBeforeRow));
      const spacingX = totalInRow <= 1 ? 0 : Math.min(58, Math.max(28, availableWidth / Math.max(1, totalInRow - 1)));
      const rowWidth = (totalInRow - 1) * spacingX;
      const startX = availableLeft + (availableWidth - rowWidth) / 2;
      return { x: startX + col * spacingX, y: centerY + row * rowGap };
    }
    function applySettledLetterStyle(obj, totalCount = settledLetters.length){

      const row = Math.floor(obj.order / layout.cols);
      const itemsBeforeRow = row * layout.cols;
      const totalInRow = Math.min(layout.cols, Math.max(1, layout.count - itemsBeforeRow));
      const spacingX = totalInRow <= 1 ? 58 : Math.min(58, Math.max(28, layout.availableWidth / Math.max(1, totalInRow - 1)));
      const baseFontSize = Math.max(18, Math.min(34, Math.floor(spacingX / 1.6)));
      if (obj.clicked) {

    function repositionSettledLetters(){

    function stopDictationSession(message = '', resumeBasic = true){

    function finishDictationSession(){
      if (!dictationSession) return;

      const average = Math.round(session.totalScore / total);
      const passRate = Math.round((session.passCount / total) * 100);
      const details = session.results.map(item => `${item.expected.toUpperCase()}: ${item.score}`).join('  ');
      const clickedSet = new Set(basicClickedSequence);
      const remaining = settledLetters.filter(o => !clickedSet.has(o.ch)).length;
      let summary = `${t('dictationResult')}\n${t('dictationAverage')}: ${average}\n${t('dictationPassRate')}: ${passRate}%\n${details}`;
      if (remaining === 0) {
        summary += `\n${t('allPassed')}`;

        summary += `\n${t('dictationRemaining')}: ${remaining}`;

    function markLetterAsRecognized(ch){

    function checkBasicComplete(){
      if (gameMode !== 'basic' || !running) return;

    function completeDictationAttempt(result){
      const session = dictationSession;
      if (!session || !session.active || !session.awaiting) return;
      session.awaiting = false;
      clearTimeout(session.waitTimer);
      const expected = session.sequence[session.index];
      const evaluation = result || { heard: '', score: 0, pass: false };
      session.results.push({ expected, heard: evaluation.heard, score: evaluation.score, pass: evaluation.pass });
      session.totalScore += evaluation.score;
      if (evaluation.pass) session.passCount += 1;
      if (evaluation.score > 80) markLetterAsRecognized(expected);
      session.index += 1;
      if (session.index >= session.sequence.length) {
        session.stepTimer = setTimeout(finishDictationSession, 500);
      } else {
        const heardText = evaluation.heard || t('dictationMissed');
        showDictationPanel(`${expected.toUpperCase()}: ${evaluation.score}\n${t('dictationHeard')}: ${heardText}\n${t('dictationAverage')}: ${Math.round(session.totalScore / session.results.length)}`);

      }

    function runDictationStep(){
      const session = dictationSession;

      showDictationPanel(`${t('dictationPrompt')} ${expected.toUpperCase()}\n${t('dictationListening')} ${session.index + 1}/${session.sequence.length}`);
      window.speechSynthesis.cancel();

      session.awaiting = true;
      session.waitTimer = setTimeout(() => completeDictationAttempt({ heard: '', score: 0, pass: false }), 2500);
    }
    function startDictationSession(){
      const clickedSet = new Set(basicClickedSequence);
      const allSettled = settledLetters.map(o => o.ch);
      const seq = allSettled.filter(ch => !clickedSet.has(ch));
      if (!seq.length) {
        showDictationPanel(t('allCorrect'));
        window.speechSynthesis.cancel();

      }

        const reason = (typeof SpeechSDK === 'undefined') ? '语音SDK未加载，请检查网络后刷新页面' : t('dictationFallback');
        showDictationPanel(reason);
        playSequenceOnly();
        return;
      }
      stopDictationSession();
      stopVoiceInput();
      showDictationPanel(`${t('dictationTitle')}\n${t('dictationListening')}...`);
      setDictationButtonUI(true);
      _dictationMicPermissionPending = true;
      ensureMicPermission().then(granted => {
        if (!_dictationMicPermissionPending) return;

          playSequenceOnly();

    function launchDictationRecognition(seq){
      dictationSession = {
        active: true,
        awaiting: false,
        index: 0,
        totalScore: 0,
        passCount: 0,
        sequence: seq,
        results: [],
        waitTimer: 0,
        stepTimer: 0,
        recognition: null,
        azureRecognizer: null
      };
      if (running && gameMode === 'basic') syncBasicLetterSpeech(true);

        launchDictationNative();
        dictationSession.stepTimer = setTimeout(runDictationStep, 200);

        launchDictationAzure();

    function handleDictationResult(alternatives){
      if (!dictationSession?.active || !dictationSession.awaiting) return;
      const expected = dictationSession.sequence[dictationSession.index];
      let eval2 = scorePronunciation(expected, alternatives);
      const bestLetter = bestLetterFromAlternatives(alternatives);
      if (eval2.score <= 80 && bestLetter === expected) {
        const heard = (alternatives[0]?.transcript || '').trim() || eval2.heard;
        eval2 = { heard, score: 85, pass: true };
      }
      showHeardText((eval2.heard || t('dictationMissed')) + ' → ' + (eval2.score > 80 ? expected : '?'));
      completeDictationAttempt(eval2);
    }
    function launchDictationNative(){
      const recognition = new SpeechRecognitionCtor();
      recognition.lang = voiceLangSel.value || 'en-US';
      recognition.interimResults = false;
      recognition.continuous = true;
      recognition.maxAlternatives = 5;
      recognition.onresult = (event) => {
        if (!dictationSession?.active || !dictationSession.awaiting) return;
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (!result.isFinal) continue;
          const alternatives = [];
          for (let j = 0; j < result.length; j++) {
            alternatives.push({ transcript: result[j].transcript, confidence: result[j].confidence });
          }
          handleDictationResult(alternatives);
          return;
        }
      };
      recognition.onerror = (event) => {
        if (!dictationSession?.active) return;
        if (['audio-capture', 'not-allowed', 'service-not-allowed'].includes(event.error)) {
          stopDictationSession(t('dictationMicError'));
          playSequenceOnly();
        }
      };
      recognition.onend = () => {
        if (!dictationSession?.active) return;

      };

      try { recognition.start(); } catch {}
    }
    function launchDictationAzure(){

    function processLetterKey(rawKey){

      if (paused && !isVoiceMode()) return;
      if (isBasicDictationPaused()) return;
      const candidates = letters.filter(obj => obj.alive && obj.ch === key);
      if (candidates.length) {
        candidates.sort((a,b) => b.y - a.y);
        onCorrect(key, candidates[0]);
      } else if (gameMode === 'basic') {
        const settled = settledLetters.find(o => o.ch === key && !o.clicked);
        if (settled) {

          score += 10 + Math.min(20, combo);
          maxComboSeen = Math.max(maxComboSeen, combo);
          playWater();
          window.speechSynthesis.cancel();
          speakLetter(key);
          updateHUD();
        }
      } else if (isVoiceMode()) {
        const idx = recentlyFallen.findIndex(r => r.ch === key);
        if (idx !== -1) {
          recentlyFallen.splice(idx, 1);
          combo += 1; streakBad = 0;
          score += 10 + Math.min(20, combo);
          maxComboSeen = Math.max(maxComboSeen, combo);
          playWater();
          window.speechSynthesis.cancel();
          speakLetter(key);
          updateHUD();

    function focusBestInput(){ if (isVoiceMode()) { game.focus(); return; } if (isTouchLike()) mobileInput.focus({ preventScroll: true }); else game.focus(); }

    function tick(t0){
      const dt = Math.min(0.033, (t0 - lastT) / 1000);
      lastT = t0;
      if (running && !paused) {
        if (!isBasicDictationPaused()) {
          elapsed += dt;
          if (gameMode === 'normal') {
            const newLevel = 1 + Math.floor(elapsed / levelEverySec());
            if (newLevel !== level) { level = newLevel; updateHUD(); }
          }
          spawnTimer += dt * 1000;
          const interval = currentSpawnInterval();
          while (spawnTimer >= interval) {
            spawnTimer -= interval;
            if (gameMode === 'normal') spawnLetter();
          }
          const bounds = getGameBounds();
          const voiceBasicTick = gameMode === 'basic' && isVoiceMode();
          const deathLine = voiceBasicTick
            ? game.clientHeight - 40
            : Math.max(bounds.topBlocked + 120, game.clientHeight - bounds.bottomBlocked + 10);
          for (const obj of [...letters]) {
            if (!obj.alive) continue;
            obj.y += obj.vy * dt;
            obj.el.style.top = `${obj.y}px`;

              if (gameMode === 'basic' && obj.basic) {

                removeLetter(obj);

                if (isVoiceMode()) {
                  recentlyFallen.push({ ch: obj.ch, time: performance.now() });
                } else {
                  penalize(t('missed'));
                  if (!running) break;
                }
              }
            }
          }
          letters = letters.filter(obj => obj.alive);
          const now = performance.now();
          const expired = recentlyFallen.filter(r => now - r.time > 3000);
          expired.forEach(() => { penalize(t('missed')); });
          recentlyFallen = recentlyFallen.filter(r => now - r.time <= 3000);
          if (!running) { recentlyFallen = []; }
        }
        renderKeyboardHighlights();
      }
      requestAnimationFrame(tick);
    }

    function updateUILanguage(){
      document.documentElement.lang = uiLanguageSel.value === 'en' ? 'en' : 'zh-CN';
      basicModeBtn.textContent = t('basic');
      dictationTitle.textContent = t('dictationTitle');
      if (!dictationPanel.classList.contains('show')) dictationBody.textContent = t('dictationReady');
      settingsBtn.textContent = t('settings');
      closeSettingsBtn.textContent = t('close');
      restartBtn.textContent = t('restart');
      closeOverBtn.textContent = t('close');
      $('settingsTitle').textContent = t('settings');
      $('leaderboardTitle').textContent = t('leaderboardTitle');
      $('labelScore').textContent = t('score');
      $('labelHp').textContent = t('hp');
      $('labelCombo').textContent = t('combo');
      $('labelMistakes').textContent = t('mistakes');
      $('labelLevel').textContent = t('level');
      $('labelRec').textContent = t('rec');
      $('labelBaseSpeed').textContent = t('baseSpeed');
      $('labelBaseSpawn').textContent = t('baseSpawn');
      $('labelMaxLetters').textContent = t('maxLetters');
      $('labelHpMax').textContent = t('hpMax');
      $('labelLevelEvery').textContent = t('levelEvery');
      $('labelVoiceLang').textContent = t('voiceLang');
      $('labelVoiceDuration').textContent = t('voiceDuration');
      $('labelUiLanguage').textContent = t('uiLanguage');
      updateInputModeBtn();
      $('azureNote').textContent = t('azureNote');
      $('settingsNote').textContent = t('settingsNote');
      $('clearLeaderboardBtn').textContent = t('clearLeaderboard');
      $('mobileHint').textContent = t('mobileHint');
      $('mobileInput').placeholder = t('mobilePlaceholder');
      $('tapTitle').textContent = t('tapTitle');
      $('tapBody').textContent = t('tapBody');
      $('gameOverTitle').textContent = t('gameOver');
      setGameToggleUI(running);
      setRecUI(!!(recorder && recorder.state !== 'inactive'));
      setDictationButtonUI(!!dictationSession?.active);
      renderLeaderboard();
    }

    settingsBtn.addEventListener('click', () => { settings.classList.toggle('show'); _updateUsageDisplay(); });
    closeSettingsBtn.addEventListener('click', () => settings.classList.remove('show'));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') settings.classList.remove('show'); });
    document.addEventListener('pointerdown', (e) => {
      if (!settings.classList.contains('show')) return;
      if (settings.contains(e.target) || settingsBtn.contains(e.target)) return;
      settings.classList.remove('show');
    });
    basicModeBtn.addEventListener('click', startBasicMode);
    advancedModeBtn.addEventListener('click', () => { if (dictationSession?.active) stopDictationSession(t('dictationStopped')); else startDictationSession(); });
    startGameBtn.addEventListener('click', () => { if (running) stopGame(); else startGame(); });
    startRecBtn.addEventListener('click', () => { if (recorder && recorder.state !== 'inactive') stopRecording(); else startRecording(); });
    restartBtn.addEventListener('click', () => { if (gameMode === 'basic') startBasicMode(); else startGame(); });
    closeOverBtn.addEventListener('click', () => gameOver.classList.remove('show'));
    hpMaxInput.addEventListener('change', () => { hpMax = Math.max(1, Math.min(20, Number(hpMaxInput.value) || 10)); hp = hpMax; updateHUD(); });
    uiLanguageSel.addEventListener('change', updateUILanguage);
    function updateInputModeBtn(){
      inputModeBtn.textContent = isVoiceMode() ? '🎤' : '⌨️';
    }
    function toggleInputMode(){
      currentInputMode = isVoiceMode() ? 'keyboard' : 'voice';
      if (currentInputMode === 'voice' && !canDoSpeech()) {
        alert(t('voiceNotSupported'));
        currentInputMode = 'keyboard';
      }
      updateInputModeBtn();
      applyInputModeUI();
      if (running) {
        if (isVoiceMode()) { stopVoiceInput(); startVoiceInput(); }
        else { stopVoiceInput(); focusBestInput(); }
      }
    }
    inputModeBtn.addEventListener('click', toggleInputMode);
    pauseBtn.addEventListener('click', togglePause);
    clearLeaderboardBtn.addEventListener('click', () => {
      try { localStorage.removeItem(SCORE_STORAGE_KEY); } catch {}
      latestSavedRecordKey = null;
      renderLeaderboard();
    });

    function unlockOnce(){
      ensureAudio();
      tapToEnable.classList.add('hide');
      focusBestInput();
      ['pointerdown','keydown','touchstart','touchend','click'].forEach(ev => window.removeEventListener(ev, unlockOnce));
    }
    ['pointerdown','keydown','touchstart','touchend','click'].forEach(ev => window.addEventListener(ev, unlockOnce, { once: false }));
    document.querySelectorAll('.btn').forEach(btn => btn.addEventListener('click', () => { if (!audioUnlocked) ensureAudio(); }, true));
    let _lastPauseTap = 0;
    game.addEventListener('click', (e) => {
      if (!running) return;
      const interactive = e.target.closest('button, input, select, a, #controlBar, #settings, #hud, #leaderboard, #dictationPanel, #gameOver, #mobileInputWrap, #tapToEnable, #kbdWrap, #micStatus');
      if (interactive) return;
      if (isVoiceMode() && !paused) return;
      const now = Date.now();
      if (now - _lastPauseTap < 400) return;
      _lastPauseTap = now;
      togglePause();
    });
    window.addEventListener('orientationchange', () => setTimeout(() => { focusBestInput(); repositionSettledLetters(); }, 300));
    window.addEventListener('resize', () => repositionSettledLetters());

    function runSelfChecks(){
      console.assert(formatTimestamp(new Date('2026-03-09T07:08:09').getTime()).includes('2026-03-09'), 'formatTimestamp failed');
      console.assert(Array.isArray(loadTopScores()), 'loadTopScores should return array');
      console.assert(typeof computeSettledPosition(0).x === 'number', 'computeSettledPosition failed');
    }
    runSelfChecks();

    updateHUD();
    updateUILanguage();
    _parseAzureKeys();
    $('azureKey')?.addEventListener('input', _parseAzureKeys);
    renderLeaderboard();
    setTimeout(announceLeaderboard, 400);
    setRecUI(false);
    setGameToggleUI(false);
    setDictationButtonUI(false);
    requestAnimationFrame((t0) => { lastT = t0; requestAnimationFrame(tick); });
  })();
  </script>
</body>
</html>
